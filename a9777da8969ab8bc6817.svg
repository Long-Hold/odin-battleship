<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80">
  <defs>
    <linearGradient id="b-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6070"/>
      <stop offset="55%" stop-color="#364e5e"/>
      <stop offset="100%" stop-color="#22323f"/>
    </linearGradient>
    <linearGradient id="b-deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#506878"/>
      <stop offset="100%" stop-color="#3c5668"/>
    </linearGradient>
  </defs>

  <!-- Drop shadow -->
  <polygon points="22,42 36,60 208,60 220,42" fill="#0e1820" opacity="0.35"/>

  <!-- Main hull — pointed bow, tapered stern -->
  <polygon points="18,40 36,22 210,22 222,40 210,58 36,58"
           fill="url(#b-hull)" stroke="#385060" stroke-width="1"/>

  <!-- Deck surface (inner) -->
  <polygon points="24,40 38,26 206,26 218,40 206,54 38,54"
           fill="url(#b-deck)"/>

  <!-- Fore gun turret (offset left) -->
  <ellipse cx="68" cy="40" rx="11" ry="11" fill="#253444" stroke="#3a5060" stroke-width="1"/>
  <rect x="68" y="37" width="20" height="3" rx="1" fill="#1c2a38"/>
  <rect x="68" y="40" width="20" height="3" rx="1" fill="#1c2a38"/>
  <!-- Turret detail -->
  <ellipse cx="68" cy="40" rx="7" ry="7" fill="#1e2c3c"/>
  <circle  cx="68" cy="40" r="3" fill="#18242f"/>

  <!-- Aft gun turret -->
  <ellipse cx="172" cy="40" rx="11" ry="11" fill="#253444" stroke="#3a5060" stroke-width="1"/>
  <rect x="152" y="37" width="20" height="3" rx="1" fill="#1c2a38"/>
  <rect x="152" y="40" width="20" height="3" rx="1" fill="#1c2a38"/>
  <ellipse cx="172" cy="40" rx="7" ry="7" fill="#1e2c3c"/>
  <circle  cx="172" cy="40" r="3" fill="#18242f"/>

  <!-- Central bridge / superstructure -->
  <rect x="102" y="27" width="36" height="26" rx="2" fill="#243444"/>
  <rect x="108" y="23" width="24" height="8"  rx="1.5" fill="#1e2c3c"/>
  <rect x="114" y="19" width="12" height="6"  rx="1" fill="#182230"/>

  <!-- Bridge windows -->
  <rect x="110" y="25" width="4" height="3" rx="0.5" fill="#3a6a80" opacity="0.9"/>
  <rect x="116" y="25" width="4" height="3" rx="0.5" fill="#3a6a80" opacity="0.9"/>
  <rect x="122" y="25" width="4" height="3" rx="0.5" fill="#3a6a80" opacity="0.9"/>
  <rect x="128" y="25" width="4" height="3" rx="0.5" fill="#3a6a80" opacity="0.9"/>

  <!-- Mast -->
  <line x1="120" y1="19" x2="120" y2="13" stroke="#5a7a8a" stroke-width="1.5"/>
  <line x1="114" y1="15" x2="126" y2="15" stroke="#5a7a8a" stroke-width="1"/>
  <circle cx="120" cy="13" r="1.5" fill="#7aaabb"/>

  <!-- Keel / centerline -->
  <line x1="36" y1="40" x2="206" y2="40" stroke="#2a3e50" stroke-width="0.8" opacity="0.5"/>

  <!-- Hull highlight -->
  <polygon points="18,40 36,22 210,22 222,40 210,58 36,58"
           fill="none" stroke="#6090a4" stroke-width="0.6" opacity="0.5"/>
  <line x1="18" y1="40" x2="36" y2="22" stroke="#7aaabb" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="40" x2="36" y2="58" stroke="#7aaabb" stroke-width="0.8" opacity="0.6"/>
</svg>
