<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 80">
  <defs>
    <linearGradient id="c-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e6878"/>
      <stop offset="55%" stop-color="#3a5464"/>
      <stop offset="100%" stop-color="#243444"/>
    </linearGradient>
    <linearGradient id="c-deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#546e80"/>
      <stop offset="100%" stop-color="#3e5a6c"/>
    </linearGradient>
  </defs>

  <!-- Drop shadow -->
  <polygon points="22,42 30,64 264,64 272,42" fill="#0e1820" opacity="0.35"/>

  <!-- Main hull — wide, almost rectangular (carriers are massive) -->
  <polygon points="20,40 30,17 260,17 270,40 260,63 30,63"
           fill="url(#c-hull)" stroke="#3a5464" stroke-width="1"/>

  <!-- Flight deck surface -->
  <polygon points="26,40 34,22 256,22 264,40 256,58 34,58"
           fill="url(#c-deck)"/>

  <!-- Deck panels / seam lines -->
  <line x1="80"  y1="22" x2="80"  y2="58" stroke="#2e4452" stroke-width="0.8"/>
  <line x1="140" y1="22" x2="140" y2="58" stroke="#2e4452" stroke-width="0.8"/>
  <line x1="200" y1="22" x2="200" y2="58" stroke="#2e4452" stroke-width="0.8"/>

  <!-- Runway centerline -->
  <line x1="34" y1="40" x2="256" y2="40"
        stroke="#2a3e50" stroke-width="1.2" stroke-dasharray="12,8"/>

  <!-- Arrestor wire markers -->
  <line x1="90"  y1="30" x2="90"  y2="50" stroke="#5a8090" stroke-width="1.2"/>
  <line x1="106" y1="28" x2="106" y2="52" stroke="#5a8090" stroke-width="1.2"/>
  <line x1="122" y1="28" x2="122" y2="52" stroke="#5a8090" stroke-width="1.2"/>

  <!-- Island superstructure (starboard/top, aft-of-amidships) -->
  <rect x="178" y="16" width="58" height="7" rx="1.5" fill="#253444"/>
  <rect x="185" y="10" width="44" height="7" rx="1.5" fill="#1e2c3c"/>
  <rect x="192" y="5"  width="32" height="6" rx="1"   fill="#19252f"/>

  <!-- Bridge windows -->
  <rect x="194" y="7"  width="4" height="3" rx="0.5" fill="#3a6a80" opacity="0.8"/>
  <rect x="200" y="7"  width="4" height="3" rx="0.5" fill="#3a6a80" opacity="0.8"/>
  <rect x="206" y="7"  width="4" height="3" rx="0.5" fill="#3a6a80" opacity="0.8"/>
  <rect x="212" y="7"  width="4" height="3" rx="0.5" fill="#3a6a80" opacity="0.8"/>

  <!-- Radar mast -->
  <line x1="208" y1="5" x2="208" y2="0" stroke="#5a7a8a" stroke-width="1.5"/>
  <line x1="203" y1="2" x2="213" y2="2" stroke="#5a7a8a" stroke-width="1"/>
  <circle cx="208" cy="0" r="1.5" fill="#7aaabb"/>

  <!-- Funnel -->
  <rect x="228" y="11" width="7" height="12" rx="1" fill="#182230"/>
  <rect x="229" y="10" width="5" height="3"  rx="0.5" fill="#243040"/>

  <!-- Hull edge highlight -->
  <polygon points="20,40 30,17 260,17 270,40 260,63 30,63"
           fill="none" stroke="#6090a4" stroke-width="0.6" opacity="0.5"/>

  <!-- Bow waterline highlight -->
  <line x1="20" y1="40" x2="30" y2="17" stroke="#7aaabb" stroke-width="0.8" opacity="0.6"/>
  <line x1="20" y1="40" x2="30" y2="63" stroke="#7aaabb" stroke-width="0.8" opacity="0.6"/>
</svg>
