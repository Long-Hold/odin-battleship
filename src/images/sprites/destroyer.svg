<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 80">
  <defs>
    <linearGradient id="d-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48606e"/>
      <stop offset="55%" stop-color="#354c5a"/>
      <stop offset="100%" stop-color="#213040"/>
    </linearGradient>
    <linearGradient id="d-deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e6676"/>
      <stop offset="100%" stop-color="#3a5465"/>
    </linearGradient>
  </defs>

  <!-- Drop shadow -->
  <polygon points="17,42 34,58 162,58 174,42" fill="#0e1820" opacity="0.35"/>

  <!-- Hull — narrow, very pointed bow -->
  <polygon points="14,40 34,24 162,24 174,40 162,56 34,56"
           fill="url(#d-hull)" stroke="#355060" stroke-width="1"/>

  <!-- Deck surface -->
  <polygon points="20,40 36,28 160,28 170,40 160,52 36,52"
           fill="url(#d-deck)"/>

  <!-- Forward gun mount -->
  <ellipse cx="62" cy="40" rx="9" ry="9" fill="#243444" stroke="#3a5060" stroke-width="0.8"/>
  <rect x="62" y="37.5" width="18" height="2.5" rx="1" fill="#1a2838"/>
  <ellipse cx="62" cy="40" rx="5" ry="5" fill="#1c2a38"/>
  <circle  cx="62" cy="40" r="2" fill="#16222c"/>

  <!-- Bridge / superstructure -->
  <rect x="92" y="28" width="32" height="24" rx="2" fill="#243444"/>
  <rect x="97" y="24" width="22" height="6"  rx="1.5" fill="#1e2c3c"/>
  <rect x="102" y="20" width="12" height="5" rx="1" fill="#182230"/>

  <!-- Bridge windows -->
  <rect x="99"  y="26" width="3" height="2.5" rx="0.5" fill="#3a6a80" opacity="0.9"/>
  <rect x="104" y="26" width="3" height="2.5" rx="0.5" fill="#3a6a80" opacity="0.9"/>
  <rect x="109" y="26" width="3" height="2.5" rx="0.5" fill="#3a6a80" opacity="0.9"/>
  <rect x="114" y="26" width="3" height="2.5" rx="0.5" fill="#3a6a80" opacity="0.9"/>

  <!-- Mast -->
  <line x1="108" y1="20" x2="108" y2="15" stroke="#5a7a8a" stroke-width="1.5"/>
  <line x1="103" y1="17" x2="113" y2="17" stroke="#5a7a8a" stroke-width="1"/>
  <circle cx="108" cy="15" r="1.5" fill="#7aaabb"/>

  <!-- Aft torpedo tubes / equipment -->
  <rect x="144" y="36" width="14" height="8" rx="1" fill="#1e2c3c"/>
  <line x1="144" y1="38" x2="158" y2="38" stroke="#2e4452" stroke-width="0.8"/>
  <line x1="144" y1="40" x2="158" y2="40" stroke="#2e4452" stroke-width="0.8"/>
  <line x1="144" y1="42" x2="158" y2="42" stroke="#2e4452" stroke-width="0.8"/>

  <!-- Hull highlight -->
  <polygon points="14,40 34,24 162,24 174,40 162,56 34,56"
           fill="none" stroke="#6090a4" stroke-width="0.6" opacity="0.5"/>
  <line x1="14" y1="40" x2="34" y2="24" stroke="#7aaabb" stroke-width="0.8" opacity="0.6"/>
  <line x1="14" y1="40" x2="34" y2="56" stroke="#7aaabb" stroke-width="0.8" opacity="0.6"/>
</svg>
