<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80">
  <defs>
    <linearGradient id="p-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6272"/>
      <stop offset="55%" stop-color="#374e5e"/>
      <stop offset="100%" stop-color="#23343f"/>
    </linearGradient>
    <linearGradient id="p-deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#506878"/>
      <stop offset="100%" stop-color="#3c5668"/>
    </linearGradient>
  </defs>

  <!-- Drop shadow -->
  <polygon points="17,42 30,58 114,58 124,42" fill="#0e1820" opacity="0.35"/>

  <!-- Main hull — compact, sharp pointed bow -->
  <polygon points="14,40 30,26 112,26 124,40 112,54 30,54"
           fill="url(#p-hull)" stroke="#365060" stroke-width="1"/>

  <!-- Deck surface -->
  <polygon points="20,40 32,30 108,30 120,40 108,50 32,50"
           fill="url(#p-deck)"/>

  <!-- Forward gun -->
  <ellipse cx="54" cy="40" rx="8" ry="8" fill="#243444" stroke="#3a5060" stroke-width="0.8"/>
  <rect x="54" y="37.5" width="16" height="2.5" rx="1" fill="#1a2838"/>
  <ellipse cx="54" cy="40" rx="4.5" ry="4.5" fill="#1c2a38"/>
  <circle  cx="54" cy="40" r="2" fill="#16222c"/>

  <!-- Bridge -->
  <rect x="76" y="30" width="26" height="20" rx="2" fill="#243444"/>
  <rect x="80" y="26" width="18" height="6"  rx="1.5" fill="#1e2c3c"/>

  <!-- Bridge windows -->
  <rect x="82"  y="28" width="3" height="2.5" rx="0.5" fill="#3a6a80" opacity="0.9"/>
  <rect x="87"  y="28" width="3" height="2.5" rx="0.5" fill="#3a6a80" opacity="0.9"/>
  <rect x="92"  y="28" width="3" height="2.5" rx="0.5" fill="#3a6a80" opacity="0.9"/>

  <!-- Mast -->
  <line x1="89" y1="26" x2="89" y2="21" stroke="#5a7a8a" stroke-width="1.5"/>
  <line x1="85" y1="23" x2="93" y2="23" stroke="#5a7a8a" stroke-width="1"/>
  <circle cx="89" cy="21" r="1.5" fill="#7aaabb"/>

  <!-- Aft deck equipment -->
  <rect x="104" y="37" width="10" height="6" rx="1" fill="#1e2c3c"/>

  <!-- Hull highlight -->
  <polygon points="14,40 30,26 112,26 124,40 112,54 30,54"
           fill="none" stroke="#6090a4" stroke-width="0.6" opacity="0.5"/>
  <line x1="14" y1="40" x2="30" y2="26" stroke="#7aaabb" stroke-width="0.8" opacity="0.6"/>
  <line x1="14" y1="40" x2="30" y2="54" stroke="#7aaabb" stroke-width="0.8" opacity="0.6"/>
</svg>
